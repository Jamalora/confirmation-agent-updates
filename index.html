<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MOFAVO Confirmation Agent — Download</title>
    <meta
      name="description"
      content="Download the MOFAVO Confirmation Agent desktop app for Windows."
    />
    <link rel="icon" href="logo.png" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #f6f6f6;
        --muted: #a5b4c4;
        --bg: #0f1e2d;
        --surface: #12263a;
        --border: #1e3550;
        --orange: #ffa055;
        --orange-light: #ffc07a;
        --orange-ink: #3a1f07;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Helvetica, Arial, sans-serif;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1;
        max-width: 720px;
        margin: 0 auto;
        padding: 56px 24px 32px;
        width: 100%;
      }
      header.brand {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 32px;
      }
      header.brand img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        background: #ffffff;
      }
      header.brand h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 0.02em;
      }
      header.brand .subtitle {
        margin: 4px 0 0;
        font-size: 14px;
        color: var(--muted);
      }
      .download-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .download-card h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      .download-version {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0.02em;
        line-height: 1;
        margin: 4px 0 8px;
      }
      .download-version .v-prefix {
        color: var(--muted);
        font-weight: 500;
        margin-right: 4px;
      }
      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 13px;
        color: var(--muted);
      }
      .meta-row .pill {
        padding: 2px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .download-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: var(--orange);
        color: var(--orange-ink);
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        padding: 14px 22px;
        border-radius: 10px;
        transition: background 0.15s ease, transform 0.05s ease;
        align-self: flex-start;
      }
      .download-btn:hover { background: var(--orange-light); }
      .download-btn:active { transform: scale(0.98); }
      .download-btn[disabled] {
        opacity: 0.55;
        pointer-events: none;
      }
      .download-icon {
        width: 18px;
        height: 18px;
      }
      .notes {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px 22px;
        margin-top: 24px;
        font-size: 14px;
        color: #d3dbe5;
        white-space: pre-wrap;
      }
      .notes h3 {
        margin: 0 0 8px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        font-weight: 600;
      }
      .error {
        color: #f3b4b4;
        font-size: 14px;
      }
      footer {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
        width: 100%;
      }
      footer a { color: var(--muted); }
      .skeleton {
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.04),
          rgba(255, 255, 255, 0.1),
          rgba(255, 255, 255, 0.04)
        );
        background-size: 200% 100%;
        animation: shimmer 1.4s ease infinite;
        border-radius: 6px;
        color: transparent;
      }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="brand">
        <img src="logo.png" alt="" />
        <div>
          <h1>MOFAVO Confirmation Agent</h1>
          <p class="subtitle">
            Desktop app for confirmation agents — Windows
          </p>
        </div>
      </header>

      <section class="download-card" id="download-card">
        <h2>Latest version</h2>
        <div class="download-version">
          <span class="v-prefix">v</span><span id="version" class="skeleton">0.0.0</span>
        </div>
        <div class="meta-row">
          <span class="pill" id="published">Released —</span>
          <span class="pill" id="platform">Windows · x64</span>
          <span class="pill" id="size">— MB</span>
        </div>
        <a
          id="download-btn"
          class="download-btn"
          href="#"
          disabled
          download
        >
          <svg
            class="download-icon"
            viewBox="0 0 20 20"
            fill="currentColor"
            aria-hidden="true"
          >
            <path d="M10 3a1 1 0 0 1 1 1v7.586l2.293-2.293a1 1 0 0 1 1.414 1.414l-4 4a1 1 0 0 1-1.414 0l-4-4a1 1 0 1 1 1.414-1.414L9 11.586V4a1 1 0 0 1 1-1Z" />
            <path d="M3 15a1 1 0 1 1 2 0v1h10v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2Z" />
          </svg>
          <span id="download-label">Loading…</span>
        </a>
      </section>

      <section class="notes" id="notes-section" hidden>
        <h3>What's new</h3>
        <div id="notes"></div>
      </section>

      <p class="error" id="error" hidden>
        Couldn't load the latest version info. Try refreshing in a moment.
      </p>
    </main>

    <footer>
      Auto-updater feed: <a href="latest.json">latest.json</a>
    </footer>

    <script>
      (async () => {
        const $ = (id) => document.getElementById(id);
        try {
          const res = await fetch("latest.json", { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();

          const win = data.platforms?.["windows-x86_64"];
          if (!data.version || !win?.url) {
            throw new Error("latest.json missing fields");
          }

          // Version + pub date
          $("version").textContent = data.version;
          $("version").classList.remove("skeleton");

          if (data.pub_date) {
            const d = new Date(data.pub_date);
            if (!isNaN(d.getTime())) {
              $("published").textContent =
                "Released " +
                d.toLocaleDateString(undefined, {
                  year: "numeric",
                  month: "long",
                  day: "numeric",
                });
            }
          }

          // Download button
          const btn = $("download-btn");
          btn.href = win.url;
          btn.removeAttribute("disabled");
          $("download-label").textContent =
            "Download for Windows";

          // Probe file size with a HEAD so we can show it on the pill.
          try {
            const head = await fetch(win.url, { method: "HEAD" });
            const len = head.headers.get("content-length");
            if (len) {
              const mb = (Number(len) / (1024 * 1024)).toFixed(1);
              $("size").textContent = mb + " MB";
            }
          } catch (_) {
            $("size").hidden = true;
          }

          // Notes
          if (data.notes && data.notes.trim()) {
            $("notes").textContent = data.notes.trim();
            $("notes-section").hidden = false;
          }

          document.title =
            "MOFAVO Confirmation Agent v" + data.version + " — Download";
        } catch (err) {
          console.error(err);
          $("error").hidden = false;
          $("download-card").style.display = "none";
        }
      })();
    </script>
  </body>
</html>
